<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NH TOPO Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        body { margin: 0; background: white; color: #333; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .controls { position: fixed; left: 20px; display: flex; flex-direction: column; gap: 5px; background: rgba(0, 0, 0, 0.05); padding: 15px; z-index: 100; width: 280px; overflow-y: auto; }
        
        .box-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid #ccc; padding-bottom: 4px; color: #444; }
        .box-1 { top: 20px; max-height: 40vh; }
        .box-2 { top: 44vh; max-height: 25vh; }
        .box-3 { top: 71vh; max-height: 27vh; }
        
        .loading-active { pointer-events: none; opacity: 0.3; }
        .master-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; margin-bottom: 10px; color: white; font-weight: bold; background: #8A9A5B; }
        
        #info-panel { position: fixed; top: 20px; right: 20px; width: 320px; max-height: 90vh; display: flex; flex-direction: column; gap: 10px; z-index: 100; overflow-y: auto; padding-right: 10px; }
        .text-box { background: #f0f9f0; padding: 10px 15px; font-size: 13px; cursor: pointer; transition: max-height 0.4s ease-in-out; max-height: 40px; border-left: 3px solid #8A9A5B; overflow: hidden; }
        .text-box.expanded { max-height: 1000px; }
        .text-box b { display: block; margin-bottom: 5px; }
        
        #stage { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .object { position: absolute; width: 95%; height: 95%; opacity: 0; transition: opacity 0.4s ease; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        
        /* Specific positioning */
        .house-layer { z-index: 50; transform: translate(calc(-50% - 15px), calc(-50% - 20px)) !important; }
        .view-layer { z-index: 5; }
        .box-3-offset { width: 140% !important; height: 140% !important; transform: translate(calc(-50% - 200px), calc(-50% - 40px)) !important; }
        
        .show { opacity: 1; }
        #loading-spinner { width: 30px; height: 30px; border: 3px solid rgba(0,0,0,0.1); border-top: 3px solid #8A9A5B; border-radius: 50%; animation: spin 1s linear infinite; position: absolute; left: 50%; top: 50%; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .topo-key { margin-top: 8px; display: grid; gap: 3px; font-size: 11px; }
        .key-item { display: flex; align-items: center; gap: 6px; }
        .swatch { width: 12px; height: 12px; border: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="controls box-1 loading-active">
    <div class="box-title">1. Site Elements and Buffers</div>
    <button id="master-toggle-1" class="master-btn">ALL</button>
    <label><input type="checkbox" id="toggle-prop"> Property Line</label>
    <label><input type="checkbox" id="toggle-drive"> Driveway</label>
    <label><input type="checkbox" id="toggle-topo"> Topo</label>
    <label><input type="checkbox" id="toggle-water"> Water</label>
    <label><input type="checkbox" id="toggle-setback"> Setbacks</label>
    <label><input type="checkbox" id="toggle-b25"> 25' No-Cut Wetland Buffer</label>
    <label><input type="checkbox" id="toggle-b50"> 50' No-Cut Wetland Buffer</label>
    <label><input type="checkbox" id="toggle-b75"> 75' Limited Cut, Septic Wetland Buffers</label>
    <label><input type="checkbox" id="toggle-b100"> 100' No-Cut No-Disturbance Buffer</label>
</div>

<div class="controls box-2 loading-active">
    <div class="box-title">2. Inside the Buildable Area</div>
    <label><input type="checkbox" id="toggle-build"> Buildable Area</label>
    <label><input type="checkbox" id="toggle-neighbor"> Direction of neighboring properties</label>
    <label><input type="checkbox" id="toggle-house"> House</label>
</div>

<div class="controls box-3 loading-active">
    <div class="box-title">3. View & Environment</div>
    <label><input type="checkbox" id="toggle-b150"> 150' Woodland Buffer</label>
    <label><input type="checkbox" id="toggle-b250"> 250' Woodland Buffer</label>
    <label><input type="checkbox" id="toggle-v-open"> View to Open Water</label>
    <label><input type="checkbox" id="toggle-v-wood"> View to Woods</label>
    <label><input type="checkbox" id="toggle-v-shallow"> View to Shallow Water</label>
    <hr>
    <label><input type="checkbox" id="toggle-sun-s"> Summer Sun</label>
    <label><input type="checkbox" id="toggle-sun-w"> Winter Sun</label>
    <label><input type="checkbox" id="toggle-w-win"> Winter Wind Rose</label>
    <label><input type="checkbox" id="toggle-w-spr"> Spring Wind Rose</label>
    <label><input type="checkbox" id="toggle-w-sum"> Summer Wind Rose</label>
    <label><input type="checkbox" id="toggle-w-fall"> Fall Wind Rose</label>
</div>

<div id="info-panel"></div>

<div id="stage">
    <div id="loading-spinner"></div>
    <div id="obj-prop" class="object"></div>
    <div id="obj-drive" class="object"></div>
    <div id="obj-topo" class="object"></div>
    <div id="obj-water" class="object"></div>
    <div id="obj-setback" class="object"></div>
    <div id="obj-b25-a" class="object"></div><div id="obj-b25-b" class="object"></div>
    <div id="obj-b50-a" class="object"></div><div id="obj-b50-b" class="object"></div>
    <div id="obj-b75-a" class="object"></div><div id="obj-b75-b" class="object"></div>
    <div id="obj-b100-a" class="object"></div><div id="obj-b100-b" class="object"></div><div id="obj-b100-c" class="object"></div>
    
    <div id="obj-build" class="object"></div>
    <div id="obj-neighbor-a" class="object"></div><div id="obj-neighbor-b" class="object"></div>
    <div id="obj-house" class="object house-layer"></div>
    
    <div id="obj-b150" class="object"></div>
    <div id="obj-b250" class="object"></div>
    <div id="obj-v-open" class="object view-layer"></div>
    <div id="obj-v-wood" class="object view-layer"></div>
    <div id="obj-v-shallow" class="object view-layer"></div>
    
    <div id="obj-sun-s" class="object box-3-offset"></div>
    <div id="obj-sun-w" class="object box-3-offset"></div>
    <div id="obj-w-win" class="object box-3-offset"></div>
    <div id="obj-w-spr" class="object box-3-offset"></div>
    <div id="obj-w-sum" class="object box-3-offset"></div>
    <div id="obj-w-fall" class="object box-3-offset"></div>
</div>

<script>
window.onload = function() {
    const user = "isabella-cpu";
    const repo = "NH-TOPO";
    const cb = "v=" + Date.now();

    const config = {
        "prop": { files: ["LINE 88.json"], title: "Property Line", text: "The legal boundary of the property." },
        "drive": { files: ["DRIVEWAY.json"], title: "Driveway", text: "Existing Driveway" },
        "topo": { files: ["TOPOTOPO.json"], title: "Topo", text: `Key: (feet above sea level)<div class="topo-key"><div class="key-item"><div class="swatch" style="background:#252e14"></div>6-8</div><div class="key-item"><div class="swatch" style="background:#89a848"></div>20-22</div><div class="key-item"><div class="swatch" style="background:#f2f7ea"></div>30-34</div></div>` },
        "water": { files: ["WATERWATER.json"], title: "Water", text: "Tidal Wetland and Riverine wetland systems." },
        "setback": { files: ["PROP SETBACK.json"], title: "Setbacks", text: "Dimensional requirements measured from property boundaries." },
        "b25": { files: ["LINE 1313.json", "LINE 44.json"], title: "25' No-Cut Wetland Buffer", text: "Tiered protection zones for lower-value or isolated wetlands providing a minimum 25-foot natural vegetation filter." },
        "b50": { files: ["LINE 111.json", "LINE 33.json"], title: "50' No-Cut Wetland Buffer", text: "Standard 50-foot protection zones for state-jurisdictional wetlands to prevent sediment and nutrient runoff." },
        "b75": { files: ["LINE 1212.json", "LINE 55.json"], title: "75' Limited Cut, Septic Wetland Buffers", text: "A mandated 75-foot environmental zone serving as a transitional management area for septic placement and limited thinning." },
        "b100": { files: ["LINE 1414.json", "LINE 22.json", "LINE 66.json"], title: "100' No-Cut No-Disturbance Buffer", text: "A strict 'No-Touch' zone where tree removal and soil disturbance are prohibited to protect sensitive tidal and inland ecologies." },
        "build": { files: ["CONSTRUCTION AREAA.json"], title: "Buildable Area", text: "The portion of the site remaining after all environmental setbacks and buffers are applied." },
        "neighbor": { files: ["ARROWS.json", "NEIGHBORING HOUSES.json"], title: "Direction of neighboring properties", text: "Analysis of adjacent construction patterns and site orientations." },
        "house": { files: ["HOUSE 1.json"], title: "House", text: "Proposed building footprints for primary residence and garage." },
        "b150": { files: ["150' Woodland Buffer.json"], title: "150' Woodland Buffer", text: "Newington, NH Shoreland Zone: Primary structures are permitted within this 150' zone, provided at least 25% of the existing woodland remains in an unaltered state." },
        "b250": { files: ["250' shoreland buffer.json"], title: "250' Woodland Buffer", text: "Newington, NH Protected Shoreland: Within the 250' boundary, no specific state tree-cutting restrictions apply beyond the 150' mark. All new construction, expansions, and impervious surfaces are generally permitted subject to local lot coverage limits." },
        "v-open": { files: ["VIEW CORRIDOR NORTH.json"], title: "View to Open Water", text: "" },
        "v-wood": { files: ["VIEW CORRIDOR SOUTH.json"], text: "" },
        "v-shallow": { files: ["VIEW CORRIDOR EAST.json"], text: "" },
        "sun-s": { files: ["SUMMER SUN.json"], title: "Summer Sun", text: "Solar path analysis for summer solstice." },
        "sun-w": { files: ["WINTER SUN 1.json"], title: "Winter Sun", text: "Solar path analysis for winter solstice." },
        "w-win": { files: ["WINTER WIND ROSE.json"], title: "Winter Wind", text: "Dominant cold winds." },
        "w-spr": { files: ["SPRING WIND ROSE.json"], title: "Spring Wind", text: "Seasonal wind patterns." },
        "w-sum": { files: ["SUMMER WIND ROSE.json"], title: "Summer Wind", text: "Seasonal wind patterns." },
        "w-fall": { files: ["FALL WIND ROSE.json"], title: "Fall Wind", text: "Seasonal wind patterns." }
    };

    const anims = {};
    let isReady = false;

    // Loading delay
    setTimeout(() => {
        isReady = true;
        document.querySelectorAll('.controls').forEach(el => el.classList.remove('loading-active'));
        document.getElementById('loading-spinner').style.display = 'none';
    }, 3500);

    // Setup Toggles
    Object.keys(config).forEach(key => {
        const item = config[key];
        const toggle = document.getElementById(`toggle-${key}`);
        if (!toggle) return;

        // Initialize animations for this toggle
        anims[key] = item.files.map((file, idx) => {
            const suffix = ["-a", "-b", "-c"][idx] || "";
            const container = document.getElementById(`obj-${key}${suffix}`) || document.getElementById(`obj-${key}`);
            return lottie.loadAnimation({
                container: container,
                renderer: 'svg',
                loop: false,
                autoplay: false,
                path: `https://cdn.jsdelivr.net/gh/${user}/${repo}/${encodeURIComponent(file)}?${cb}`
            });
        });

        toggle.addEventListener('change', function() {
            if (!isReady) return;

            // Exclusive logic for Sun/Wind (Box 3)
            if (this.checked && (key.startsWith('sun-') || key.startsWith('w-'))) {
                Object.keys(config).forEach(k => {
                    if (k !== key && (k.startsWith('sun-') || k.startsWith('w-'))) {
                        const other = document.getElementById(`toggle-${k}`);
                        if (other.checked) { other.checked = false; other.dispatchEvent(new Event('change')); }
                    }
                });
            }

            if (this.checked) {
                // Show layers
                item.files.forEach((_, idx) => {
                    const suffix = ["-a", "-b", "-c"][idx] || "";
                    const el = document.getElementById(`obj-${key}${suffix}`) || document.getElementById(`obj-${key}`);
                    el.classList.add('show');
                    anims[key][idx].goToAndPlay(0, true);
                });
                // Add text box if title exists
                if (item.text) {
                    const panel = document.getElementById('info-panel');
                    const box = document.createElement('div');
                    box.id = `info-${key}`;
                    box.className = 'text-box';
                    box.innerHTML = `<b>${item.title}</b>${item.text}`;
                    box.onclick = () => box.classList.toggle('expanded');
                    panel.appendChild(box);
                }
            } else {
                // Hide layers
                item.files.forEach((_, idx) => {
                    const suffix = ["-a", "-b", "-c"][idx] || "";
                    const el = document.getElementById(`obj-${key}${suffix}`) || document.getElementById(`obj-${key}`);
                    el.classList.remove('show');
                    anims[key][idx].stop();
                });
                const box = document.getElementById(`info-${key}`);
                if (box) box.remove();
            }
        });
    });

    // Master Toggle Box 1
    document.getElementById('master-toggle-1').onclick = function() {
        const box1Keys = ["prop", "drive", "topo", "water", "setback", "b25", "b50", "b75", "b100"];
        const toggles = box1Keys.map(k => document.getElementById(`toggle-${k}`));
        const allOn = toggles.every(t => t.checked);
        toggles.forEach(t => { t.checked = !allOn; t.dispatchEvent(new Event('change')); });
    };
};
</script>
</body>
</html>
